name: Release — Project Emberfall

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-sprint1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run validation tests
        run: |
          python3 tests/validate_math.py
          if [ -f tests/validate_palettes.py ]; then
            python3 tests/validate_palettes.py
          fi

      - name: Run Godot test suites
        run: |
          chmod +x tests/run_all_tests.sh
          tests/run_all_tests.sh

      - name: Install Godot 4.2.2
        run: |
          GODOT_VERSION=4.2.2
          GODOT_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q "${GODOT_ZIP}"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          sudo mv godot /usr/local/bin/godot
          rm "${GODOT_ZIP}"

      - name: Install Godot export templates
        run: |
          GODOT_VERSION=4.2.2
          TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATE_DIR}"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${TPZ}"
          unzip -q "${TPZ}" -d "${TEMPLATE_DIR}"
          rm "${TPZ}"

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Emberfall.exe
          cd build/windows
          zip -r ../../emberfall-windows.zip Emberfall.exe Emberfall.pck

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/Emberfall.x86_64
          cd build/linux
          zip -r ../../emberfall-linux.zip Emberfall.x86_64 Emberfall.pck

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Project Emberfall — ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            emberfall-windows.zip
            emberfall-linux.zip
