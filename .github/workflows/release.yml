name: Release — Project Emberfall

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-sprint1)'
        required: true
        type: string

permissions:
  contents: write
  checks: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup Godot + Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
          cache: false

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Run validation tests
        run: |
          python3 tests/validate_math.py
          if [ -f tests/validate_palettes.py ]; then
            python3 tests/validate_palettes.py
          fi

      - name: Regenerate asset cache
        run: godot --headless --import --path .
      - name: Run Godot test suites
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: '4.6.3'
          version: 'v6.1.3'
          paths: 'res://tests'

      - name: Verify export templates
        run: |
          echo "=== Export template directory contents ==="
          ls -la /home/runner/.local/share/godot/export_templates/4.6.3.stable/
          echo "=== Godot binary ==="
          which godot
          godot --version

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          xvfb-run --auto-servernum godot --rendering-method gl_compatibility --export-release "Windows Desktop" build/windows/Emberfall.exe || true
          echo "=== Verifying Windows export artifacts ==="
          ls -la build/windows/
          test -f build/windows/Emberfall.exe || { echo "ERROR: Windows .exe missing"; exit 1; }
          test -f build/windows/Emberfall.pck || { echo "ERROR: Windows .pck missing"; exit 1; }
          cd build/windows
          zip -r ../../emberfall-windows.zip Emberfall.exe Emberfall.pck

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          xvfb-run --auto-servernum godot --rendering-method gl_compatibility --export-release "Linux/X11" build/linux/Emberfall.x86_64 || true
          echo "=== Verifying Linux export artifacts ==="
          ls -la build/linux/
          test -f build/linux/Emberfall.x86_64 || { echo "ERROR: Linux binary missing"; exit 1; }
          test -f build/linux/Emberfall.pck || { echo "ERROR: Linux .pck missing"; exit 1; }
          cd build/linux
          zip -r ../../emberfall-linux.zip Emberfall.x86_64 Emberfall.pck

      - name: Export macOS build
        run: |
          mkdir -p build/macos
          xvfb-run --auto-servernum godot --rendering-method gl_compatibility --export-release "macOS" build/macos/Emberfall.app || true
          echo "=== Verifying macOS export artifacts ==="
          ls -la build/macos/
          test -d build/macos/Emberfall.app || { echo "ERROR: macOS .app bundle missing"; exit 1; }
          cd build/macos
          zip -r ../../emberfall-macos.zip Emberfall.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Project Emberfall — ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            emberfall-windows.zip
            emberfall-linux.zip
            emberfall-macos.zip
