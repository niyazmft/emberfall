name: Release — Project Emberfall

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-sprint1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.2.2"
          mkdir -p /tmp/godot-install
          cd /tmp/godot-install

          # Download Godot binary
          GODOT_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Downloading Godot ${GODOT_VERSION}..."
          wget --tries=5 --waitretry=5 \
            "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${GODOT_ZIP}" \
            || wget --tries=5 --waitretry=5 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"

          unzip -q "${GODOT_ZIP}"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          echo "Godot installed: $(godot --version)"

          # Install export templates
          TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget --tries=5 --waitretry=5 \
            "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${TPZ}" \
            || wget --tries=5 --waitretry=5 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TPZ}"

          # Extract to a temp staging area so we can inspect the layout
          mkdir -p /tmp/godot-templates
          unzip -oq "${TPZ}" -d /tmp/godot-templates/
          
          echo "Templates extracted. Top-level contents:"
          find /tmp/godot-templates -maxdepth 2 -type d
          
          # Move the extracted folder to the exact path Godot expects
          EXPECTED="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          
          if [ -d "/tmp/godot-templates/${GODOT_VERSION}.stable" ]; then
            # .tpz had a top-level version folder (ideal)
            mv "/tmp/godot-templates/${GODOT_VERSION}.stable" "${EXPECTED}"
          else
            # Find whatever single directory was extracted
            SRC_DIR=$(find /tmp/godot-templates -maxdepth 1 -mindepth 1 -type d | head -1)
            if [ -n "$SRC_DIR" ]; then
              mv "$SRC_DIR" "${EXPECTED}"
            else
              # Flat extraction (no folder at all)
              mkdir -p "${EXPECTED}"
              mv /tmp/godot-templates/* "${EXPECTED}/" || true
            fi
          fi
          
          echo "Export templates installed at: ${EXPECTED}"
          ls -la "${EXPECTED}"

      - name: Run validation tests
        run: |
          python3 tests/validate_math.py
          if [ -f tests/validate_palettes.py ]; then
            python3 tests/validate_palettes.py
          fi

      - name: Run Godot test suites
        run: |
          chmod +x tests/run_all_tests.sh
          tests/run_all_tests.sh

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Emberfall.exe
          cd build/windows
          zip -r ../../emberfall-windows.zip Emberfall.exe Emberfall.pck

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/Emberfall.x86_64
          cd build/linux
          zip -r ../../emberfall-linux.zip Emberfall.x86_64 Emberfall.pck

      - name: Export macOS build
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" build/macos/Emberfall.zip
          cp build/macos/Emberfall.zip emberfall-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Project Emberfall — ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            emberfall-windows.zip
            emberfall-linux.zip
            emberfall-macos.zip
