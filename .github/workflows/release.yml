name: Release — Project Emberfall

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-sprint1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup Godot + Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Run validation tests
        run: |
          python3 tests/validate_math.py
          if [ -f tests/validate_palettes.py ]; then
            python3 tests/validate_palettes.py
          fi

      - name: Regenerate asset cache
        run: godot --headless --import --path .
      - name: Run Godot test suites
        run: |
          chmod +x tests/run_all_tests.sh
          tests/run_all_tests.sh

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Emberfall.exe
          cd build/windows
          zip -r ../../emberfall-windows.zip Emberfall.exe Emberfall.pck

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/Emberfall.x86_64
          cd build/linux
          zip -r ../../emberfall-linux.zip Emberfall.x86_64 Emberfall.pck

      - name: Export macOS build
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" build/macos/Emberfall.zip
          cp build/macos/Emberfall.zip emberfall-macos.zip

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          cd build
          zip -r ../emberfall-web.zip web/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Project Emberfall — ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            emberfall-windows.zip
            emberfall-linux.zip
            emberfall-macos.zip
            emberfall-web.zip
