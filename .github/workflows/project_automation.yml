name: Project Board Automation

on:
  issues:
    types: [opened]

permissions:
  repository-projects: write
  issues: write

jobs:
  add_to_project:
    name: Add issue to Project Board
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/niyazmft/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
        # This action is idempotent — if the issue is already in the project
        # (e.g. added by automation scripts), it silently no-ops.
        # Field setting (Priority, Size, Status) is handled by the creation script
        # to avoid race conditions and duplicate API calls.
