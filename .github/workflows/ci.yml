name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Markdown Lint
  # ─────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint Markdown (check only — auto-fix runs locally via hooks)
        run: markdownlint '**/*.md' --ignore node_modules --ignore .git

  # ─────────────────────────────────────────────
  # JOB 2: GDScript Format Check
  # ─────────────────────────────────────────────
  gdscript-format:
    name: gdscript-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Check GDScript formatting (no changes allowed)
        run: gdformat --check scripts/ tests/ ui/

  # ─────────────────────────────────────────────
  # JOB 3: Deterministic Math Validation (Python)
  # ─────────────────────────────────────────────
  validate-math:
    name: validate-math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run deterministic math cross-validator
        run: python3 tests/validate_math.py

  # ─────────────────────────────────────────────
  # JOB 4: GDScript Lint + Engine Scan (Godot)
  # ─────────────────────────────────────────────
  gdscript-lint:
    name: gdscript-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-4.2.2-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import assets (build class cache)
        run: godot --headless --import --path .
      - name: Run Godot editor scan
        run: |
          godot --headless --editor --quit --path . 2>&1 | tee godot_output.log
          if grep -iE "SCRIPT ERROR|Parse Error|Compile Error|hides an autoload singleton" godot_output.log; then
            echo "❌ GDScript linting failed."
            exit 1
          fi
          echo "✅ GDScript lint passed."

  # ─────────────────────────────────────────────
  # JOB 5: JSON Config Validation
  # ─────────────────────────────────────────────
  json-validate:
    name: JSON Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate all JSON config files
        run: |
          find config/ schemas/ -name '*.json' | while read f; do
            python3 -m json.tool "$f" > /dev/null && echo "  ✅ $f" || { echo "  ❌ $f"; exit 1; }
          done

  # ─────────────────────────────────────────────
  # JOB 6: Run Full Test Suite
  # ─────────────────────────────────────────────
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-4.2.2-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      
      - name: Import Project
        run: godot --headless --import --path . --quit
      
      - name: Run Full Test Suite
        run: |
          chmod +x tests/run_all_tests.sh
          tests/run_all_tests.sh 2>&1 | tee tests/test_output.log
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/test_output.log
            tests/validate_math_report.json
            tools/godot_lint.log
      
      - name: Report Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 tests/test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
