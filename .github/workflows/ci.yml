name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Static Analysis & Formatting (Required)
  # ─────────────────────────────────────────────
  gdscript-format:
    name: gdscript-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint Markdown (check only)
        run: markdownlint '**/*.md' --ignore node_modules --ignore .git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Check GDScript formatting
        run: gdformat --check scripts/ tests/ ui/
      - name: Validate JSON configs
        run: |
          find config/ schemas/ -name '*.json' | while read f; do
            python3 -m json.tool "$f" > /dev/null && echo "  ✅ $f" || { echo "  ❌ $f"; exit 1; }
          done

  # ─────────────────────────────────────────────
  # JOB 2: Deterministic Math Validation (Required)
  # ─────────────────────────────────────────────
  validate-math:
    name: validate-math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run deterministic math cross-validator
        run: python3 tests/validate_math.py

  # ─────────────────────────────────────────────
  # JOB 3: Engine Scan & Test Suite (Required)
  # ─────────────────────────────────────────────
  gdscript-lint:
    name: gdscript-lint
    runs-on: ubuntu-latest
    needs: [gdscript-format, validate-math]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Cache Godot
        uses: actions/cache@v5
        with:
          path: ~/.local/share/godot
          key: godot-4.6.3-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
      - name: Import Project
        run: godot --headless --import --path . --quit
      - name: Run Godot editor scan
        run: |
          mkdir -p tools
          godot --headless --editor --quit --path . 2>&1 | tee tools/godot_lint.log
          if ! python3 tools/filter_godot_errors.py tools/godot_lint.log; then
            echo "❌ GDScript linting failed."
            exit 1
          fi
          echo "✅ GDScript lint passed."
      - name: Run GdUnit4 Tests
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: '4.6.3'
          version: 'v6.1.3'
          paths: 'res://tests'
          publish-report: true
          report-name: 'gdUnit4-report'
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            tools/godot_lint.log
            tests/validate_math_report.json

