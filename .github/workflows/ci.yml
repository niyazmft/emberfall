name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run math validation
        run: python3 tests/validate_math.py

  gdscript-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Format code
        run: gdformat scripts/ tests/ ui/
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "style(format): Apply gdformat" -a || true
      - name: Check Formatting
        run: gdformat --check scripts/ tests/ ui/

  gdscript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Regenerate asset cache
        run: godot --headless --import --path .
      - name: Run Godot Lint (Editor Scan)
        run: |
          # The editor scan imports assets and parses all scripts.
          # It catches "hides an autoload singleton" and strict typing errors.
          godot --headless --editor --quit --path . 2>&1 | tee godot_output.log

          # Fail if critical errors are found in the output
          if grep -iE "SCRIPT ERROR|Parse Error|Compile Error|hides an autoload singleton" godot_output.log; then
            echo "------------------------------------------------"
            echo "❌ GDScript linting failed! Check for shadowing or typing errors."
            echo "------------------------------------------------"
            exit 1
          fi
          echo "✅ GDScript linting passed (no parse errors found)."
# Force refresh 3
