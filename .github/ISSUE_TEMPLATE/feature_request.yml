name: Feature Request
description: Suggest a new feature or improvement for Emberfall.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      block: |
        Thanks for the suggestion. Please describe the problem you're trying to solve, not just the solution.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the game does this affect?
      options:
        - Combat
        - Progression / Run
        - UI / UX
        - Audio
        - Visuals / Shaders
        - Tools / Dev
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or friction are you experiencing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you solve it? (optional, but helpful)
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, related DON issues, etc.
