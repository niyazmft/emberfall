name: Bug Report
description: Report a bug in Emberfall gameplay, UI, or systems.
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      block: |
        Thanks for reporting a bug. Please fill out the template below so we can reproduce and fix it.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "Priority heuristic: P0=Critical path/Blocks work, P1=Important/Polish, P2=Nice-to-have/Optional."
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "Estimated effort: XS=0.5d, S=1-2d, M=3-5d, L=1-2w, XL=2w+."
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How broken is it?
      options:
        - Critical (crash, data loss, blocker)
        - High (feature unusable, easy to hit)
        - Medium (feature usable but wrong result)
        - Low (cosmetic, edge case)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the bug occur?
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: godot-version
    attributes:
      label: Godot version
      description: Output of `godot --version`
      placeholder: "4.6.3"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Start a new run
        2. Move keeper to tile (5, 5)
        3. Attack enemy at (6, 5)
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output or attach images.
